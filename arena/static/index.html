<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ScamShield Arena</title>
<style>
  :root { --bg:#f8fafc; --card:#fff; --ink:#0f172a; --muted:#64748b; --line:#e2e8f0; --brand:#6366f1; --ok:#10b981; --hold:#ef4444; --warn:#fef3c7; }
  @media (prefers-color-scheme: dark) { :root { --bg:#0b1020; --card:#131a30; --ink:#e5e9f5; --muted:#94a3b8; --line:#243050; --warn:#4a3b12; } }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font:16px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
  header { padding:48px 16px 32px; text-align:center; background:linear-gradient(135deg,#312e81,#6366f1 55%,#10b981); color:#fff; }
  header h1 { margin:0 0 8px; font-size:clamp(28px,6vw,44px); letter-spacing:-.02em; }
  header p { margin:0 auto; max-width:620px; opacity:.92; }
  main { max-width:960px; margin:0 auto; padding:24px 16px 64px; display:grid; gap:24px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:16px; padding:20px; }
  h2 { margin:0 0 12px; font-size:20px; }
  .presets { display:flex; flex-wrap:wrap; gap:8px; margin-bottom:12px; }
  button, .chip { font:inherit; border-radius:999px; border:1px solid var(--line); background:var(--bg); color:var(--ink); padding:6px 14px; cursor:pointer; }
  button:hover { border-color:var(--brand); }
  button.primary { background:var(--brand); border-color:var(--brand); color:#fff; font-weight:600; padding:10px 22px; }
  textarea, input[type=number] { width:100%; font:inherit; color:var(--ink); background:var(--bg); border:1px solid var(--line); border-radius:10px; padding:10px; }
  textarea { min-height:120px; resize:vertical; }
  .row { display:grid; grid-template-columns:repeat(auto-fit,minmax(160px,1fr)); gap:12px; margin:12px 0; align-items:end; }
  label { font-size:14px; color:var(--muted); display:block; margin-bottom:4px; }
  #result { display:none; }
  .verdict { display:flex; align-items:center; gap:12px; font-size:22px; font-weight:700; }
  .dot { width:14px; height:14px; border-radius:50%; }
  .meter { height:12px; background:var(--line); border-radius:6px; position:relative; margin:14px 0 4px; }
  .meter i { position:absolute; inset:0 auto 0 0; border-radius:6px; }
  .meter b { position:absolute; top:-5px; width:2px; height:22px; background:var(--ink); }
  .words span { display:inline-block; margin:2px 4px 2px 0; padding:2px 10px; border-radius:999px; background:var(--warn); }
  .muted { color:var(--muted); font-size:14px; }
  img { max-width:100%; border-radius:12px; background:#fff; }
  .err { color:var(--hold); }
</style>
</head>
<body>
<header>
  <h1>ScamShield Arena</h1>
  <p>A test bench where scripted scammers keep rewording their pitch and a guardian learns to hold risky payments for a human call-back. All conversations are synthetic.</p>
</header>
<main>
  <section class="card">
    <h2>Try the guardian</h2>
    <div class="presets" id="presets"></div>
    <label for="text">Conversation (synthetic text only, no real names or numbers)</label>
    <textarea id="text"></textarea>
    <div class="row">
      <div><label for="amount">Payment amount</label><input id="amount" type="number" min="1" value="3000"></div>
      <div><label for="typical">Customer's usual amount</label><input id="typical" type="number" min="1" value="3000"></div>
      <div><label><input id="payee" type="checkbox" checked> New payee</label><button class="primary" id="go">Screen payment</button></div>
    </div>
    <div id="result">
      <div class="verdict"><span class="dot" id="dot"></span><span id="verdict"></span></div>
      <div class="meter"><i id="bar"></i><b id="thr"></b></div>
      <div class="muted" id="scoreline"></div>
      <p class="words" id="because"></p>
      <p class="muted" id="note"></p>
    </div>
    <p class="err" id="error"></p>
  </section>
  <section class="card"><h2>How it works</h2><img src="/img/pipeline.png" alt="Scammer, conversation, guardian, hold or allow, with a retrain loop"></section>
  <section class="card"><h2>What happens when scammers reword</h2><img src="/img/arms_race.png" alt="Catch rate by guardian as wording changes"></section>
  <section class="card"><h2>Who gets the false alarms?</h2><img src="/img/fairness.png" alt="False alarm rate per customer group"></section>
</main>
<script>
const PRESETS = {
  "Bank-style pressure": ["This is the fraud department speaking. This is urgent, it cannot wait. Transfer your money to a safe account now. Do not tell anyone about this call.", 20000, 3000, true],
  "Reworded (set B)": ["I represent the team that protects your savings. Time is very short here, the window closes soon. Shift the funds over to the holding account for protection. It is best if nobody else hears about this.", 18000, 3000, true],
  "Plain rent payment": ["Rent is due today, can you send it? Sending the rent now, thanks.", 3000, 3000, false],
  "Surprise party (honest)": ["Keep it secret, it is a surprise party. Here is the amount we talked about.", 400, 1500, true]
};
const $ = id => document.getElementById(id);
function load(name) { const [t, a, u, p] = PRESETS[name]; $("text").value = t; $("amount").value = a; $("typical").value = u; $("payee").checked = p; }
for (const name of Object.keys(PRESETS)) { const b = document.createElement("button"); b.textContent = name; b.onclick = () => load(name); $("presets").append(b); }
load("Bank-style pressure");
$("go").onclick = async () => {
  $("error").textContent = "";
  try {
    const r = await fetch("/screen", { method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ text: $("text").value, amount: +$("amount").value, typical_amount: +$("typical").value, new_payee: $("payee").checked }) });
    if (!r.ok) throw new Error("The request was not accepted (check the text and amounts).");
    const d = await r.json(), hold = d.action === "hold_for_callback";
    $("result").style.display = "block";
    $("verdict").textContent = hold ? "Hold for call-back" : "Allow";
    $("dot").style.background = hold ? "var(--hold)" : "var(--ok)";
    $("bar").style.width = Math.min(100, d.score * 100) + "%";
    $("bar").style.background = hold ? "var(--hold)" : "var(--ok)";
    $("thr").style.left = Math.min(100, d.threshold * 100) + "%";
    $("scoreline").textContent = `Risk score ${d.score} (hold at ${d.threshold}, the black marker)`;
    $("because").replaceChildren(...d.because.map(w => Object.assign(document.createElement("span"), { textContent: w })));
    $("note").textContent = d.note;
  } catch (e) { $("error").textContent = e.message; }
};
</script>
</body>
</html>
